# polycode: a static site (Python and Ruff run in the browser) plus a
# small backend for ids, the network proxy and live-share sessions.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind a TLS proxy (Caddy) keep its scheme, so the id cookie is Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream backend {
    server backend:8090;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml font/ttf;

    # add_header is not inherited by locations that set their own headers,
    # so the security headers live in a snippet included everywhere.
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build output and the versioned Python runtime never change.
    location ~ ^/(assets|pyodide)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;

        # Pyodide's ES modules; this nginx's mime.types does not know .mjs.
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            try_files $uri =404;
        }
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        client_max_body_size 12m;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The service worker must always be re-checked for updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Student web pages run here, in a sandboxed frame of the app (no same
    # origin): their own scripts and styles, inline or from anywhere, are allowed.
    location = /preview.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
